```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISITA TERNIUM</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f1f5f9;
display:flex;
min-height:100vh;
}

.sidebar{
width:280px;
background:linear-gradient(180deg,#020617,#0f172a);
padding:25px;
color:white;
}

.logo{
font-size:26px;
font-weight:800;
margin-bottom:40px;
color:#38bdf8;
}

.menu{
display:flex;
flex-direction:column;
gap:12px;
}

.menu button{
padding:15px;
border:none;
border-radius:14px;
background:#1e293b;
color:white;
cursor:pointer;
font-weight:700;
transition:0.3s;
}

.menu button:hover,
.menu button.active{
background:#38bdf8;
color:#0f172a;
}

.main{
flex:1;
padding:30px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.topbar{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.topbar h1{
font-size:28px;
}

.form-section,
.table-section,
.grafico-card,
.card{
background:white;
padding:25px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

label{
font-weight:bold;
display:block;
margin-bottom:8px;
}

input,
select,
textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #cbd5e1;
margin-bottom:20px;
}

.btn{
background:#0ea5e9;
color:white;
padding:14px 22px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.btn:hover{
background:#0284c7;
}

.horarios{
display:flex;
gap:10px;
}

.horario{
padding:12px 20px;
border:none;
border-radius:12px;
background:#e2e8f0;
font-weight:bold;
cursor:pointer;
}

.horario.active{
background:#0ea5e9;
color:white;
}

.status{
padding:8px 14px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.analise{background:#fef3c7;color:#92400e;}
.execucao{background:#bfdbfe;color:#1d4ed8;}
.finalizada{background:#dcfce7;color:#15803d;}
.agendada{background:#dbeafe;color:#1d4ed8;}
.encerrada{background:#fee2e2;color:#dc2626;}
.analisando{background:#ede9fe;color:#7c3aed;}
.aprovacao{background:#fde68a;color:#92400e;}

.kpis{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card p{
font-size:34px;
font-weight:800;
margin-top:10px;
}

.graficos{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

table{
width:100%;
border-collapse:collapse;
}

table th,
table td{
padding:14px;
text-align:left;
border-bottom:1px solid #e2e8f0;
}

.acoes{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.acoes button{
border:none;
padding:10px;
border-radius:10px;
font-weight:bold;
color:white;
cursor:pointer;
}

.btn-agendar{background:#0ea5e9;}
.btn-analisar{background:#7c3aed;}
.btn-executar{background:#2563eb;}
.btn-finalizar{background:#16a34a;}
.btn-recusar{background:#dc2626;}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
justify-content:center;
align-items:center;
padding:20px;
z-index:999;
}

.modal-content{
background:white;
width:700px;
max-width:100%;
padding:30px;
border-radius:20px;
}

@media(max-width:900px){

body{
flex-direction:column;
}

.sidebar{
width:100%;
}

.grid,
.graficos{
grid-template-columns:1fr;
}

.main{
padding:15px;
}

.menu{
flex-direction:row;
flex-wrap:wrap;
}

.menu button{
flex:1;
}

}

</style>
</head>
<body>

<aside class="sidebar">
<div class="logo">VISITA TERNIUM</div>

<div class="menu">
<button class="active" onclick="mostrarPagina('solicitante',this)">Solicitante</button>
<button onclick="mostrarPagina('tecnico',this)">Área Técnica</button>
</div>
</aside>

<main class="main">

<div id="solicitante" class="page active">

<div class="topbar">
<h1>Portal do Solicitante</h1>
</div>

<section class="form-section">
<h2>Nova Solicitação</h2>

<div class="grid">

<div>
<label>Nome</label>
<input type="text" id="nome">

<label>Email</label>
<input type="email" id="email">

<label>Área</label>
<input type="text" id="area">
</div>

<div>
<label>Dia</label>
<select id="dia">
<option>Selecione</option>
<option>Terça-feira</option>
<option>Quinta-feira</option>
</select>

<label>Horário</label>
<div class="horarios">
<button class="horario">09:30h</button>
<button class="horario">13:30h</button>
</div>

<br>

<label>Descrição</label>
<textarea id="descricao" rows="5"></textarea>
</div>

</div>

<button class="btn" onclick="abrirSolicitacao()">Abrir Solicitação</button>

</section>

<section class="table-section">
<h2>Solicitações</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Status</th>
<th>Técnico</th>
</tr>
</thead>
<tbody id="tabelaSolicitante"></tbody>
</table>

</section>

</div>

<div id="tecnico" class="page">

<div class="topbar">
<h1>Painel Técnico</h1>
</div>

<section class="kpis">
<div class="card">
<h3>Em análise</h3>
<p id="kpiAnalise">0</p>
</div>

<div class="card">
<h3>Em execução</h3>
<p id="kpiExecucao">0</p>
</div>

<div class="card">
<h3>Finalizadas</h3>
<p id="kpiFinalizadas">0</p>
</div>
</section>

<section class="table-section">
<h2>Solicitações Técnicas</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Solicitante</th>
<th>Status</th>
<th>Técnico</th>
<th>Ações</th>
</tr>
</thead>
<tbody id="tabelaTecnico"></tbody>
</table>

</section>

<section class="graficos">
<div class="grafico-card">
<h2>Status</h2>
<canvas id="graficoStatus"></canvas>
</div>

<div class="grafico-card">
<h2>Áreas</h2>
<canvas id="graficoArea"></canvas>
</div>
</section>

</div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyCaw5-HEvDaqB56GGLLVlMT2YiU6NS_lLU",
authDomain: "visita-ternium.firebaseapp.com",
databaseURL: "https://visita-ternium-default-rtdb.firebaseio.com",
projectId: "visita-ternium",
storageBucket: "visita-ternium.firebasestorage.app",
messagingSenderId: "892057450479",
appId: "1:892057450479:web:39505c8e30c184cafce81a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let solicitacoes = [];
let horarioSelecionado = '';

const horarios = document.querySelectorAll('.horario');

horarios.forEach(btn=>{
btn.addEventListener('click',()=>{
horarios.forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
horarioSelecionado = btn.innerText;
});
});

window.mostrarPagina = function(id,botao){

document.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active'));

 document.getElementById(id)
.classList.add('active');

 document.querySelectorAll('.menu button')
.forEach(b=>b.classList.remove('active'));

 botao.classList.add('active');

}

window.abrirSolicitacao = function(){

const nome = document.getElementById('nome').value;
const email = document.getElementById('email').value;
const area = document.getElementById('area').value;
const dia = document.getElementById('dia').value;
const descricao = document.getElementById('descricao').value;

if(!nome || !email || !area || !horarioSelecionado || dia==='Selecione'){
alert('Preencha todos os campos');
return;
}

const nova = {
id:Math.floor(Math.random()*100000),
nome,
email,
area,
dia,
descricao,
horario:horarioSelecionado,
status:'Em análise',
tecnico:'Aguardando'
};

const novaRef = push(ref(db,'solicitacoes'));
set(novaRef,nova);

alert('Solicitação enviada');

}

function carregarSolicitacoes(){

onValue(ref(db,'solicitacoes'),(snapshot)=>{

solicitacoes = [];

snapshot.forEach((item)=>{

solicitacoes.push({
firebaseId:item.key,
...item.val()
});

});

renderizar();

});

}

function atualizarFirebase(index,dados){

update(
ref(db,'solicitacoes/'+solicitacoes[index].firebaseId),
dados
);

}

window.agendar = function(index){

const tecnico = prompt('Nome técnico');
if(!tecnico) return;

atualizarFirebase(index,{
status:'Agendada',
tecnico:tecnico
});

}

window.analisar = function(index){

atualizarFirebase(index,{
status:'Técnico analisando'
});

}

window.executar = function(index){

atualizarFirebase(index,{
status:'Em execução'
});

}

window.finalizar = function(index){

atualizarFirebase(index,{
status:'Finalizada'
});

}

function dashboard(){

document.getElementById('kpiAnalise').innerText =
solicitacoes.filter(s=>s.status==='Em análise').length;

 document.getElementById('kpiExecucao').innerText =
solicitacoes.filter(s=>s.status==='Em execução').length;

 document.getElementById('kpiFinalizadas').innerText =
solicitacoes.filter(s=>s.status==='Finalizada').length;

}

let graficoStatus;
let graficoArea;

function renderizar(){

const tabelaSolicitante =
document.getElementById('tabelaSolicitante');

const tabelaTecnico =
document.getElementById('tabelaTecnico');

 tabelaSolicitante.innerHTML='';
 tabelaTecnico.innerHTML='';

solicitacoes.forEach((item,index)=>{

let classe = 'analise';

if(item.status==='Em execução') classe='execucao';
if(item.status==='Finalizada') classe='finalizada';
if(item.status==='Agendada') classe='agendada';
if(item.status==='Encerrada') classe='encerrada';
if(item.status==='Técnico analisando') classe='analisando';
if(item.status==='Aguardando aprovação') classe='aprovacao';

 tabelaSolicitante.innerHTML += `
<tr>
<td>#${item.id}</td>
<td><span class="status ${classe}">${item.status}</span></td>
<td>${item.tecnico}</td>
</tr>
`;

 tabelaTecnico.innerHTML += `
<tr>
<td>#${item.id}</td>
<td>${item.nome}<br>${item.email}</td>
<td><span class="status ${classe}">${item.status}</span></td>
<td>${item.tecnico}</td>
<td>
<div class="acoes">
<button class="btn-agendar" onclick="agendar(${index})">Agendar</button>
<button class="btn-analisar" onclick="analisar(${index})">Analisar</button>
<button class="btn-executar" onclick="executar(${index})">Executar</button>
<button class="btn-finalizar" onclick="finalizar(${index})">Finalizar</button>
</div>
</td>
</tr>
`;

});

 dashboard();
 graficos();

}

function graficos(){

const ctx1 = document.getElementById('graficoStatus');
const ctx2 = document.getElementById('graficoArea');

if(graficoStatus) graficoStatus.destroy();
if(graficoArea) graficoArea.destroy();

 graficoStatus = new Chart(ctx1,{
 type:'doughnut',
 data:{
 labels:['Análise','Execução','Finalizada'],
 datasets:[{
 data:[
 solicitacoes.filter(s=>s.status==='Em análise').length,
 solicitacoes.filter(s=>s.status==='Em execução').length,
 solicitacoes.filter(s=>s.status==='Finalizada').length
 ]
 }]
 }
 });

 const areas = {};

 solicitacoes.forEach(item=>{
 areas[item.area] = (areas[item.area]||0)+1;
 });

 graficoArea = new Chart(ctx2,{
 type:'bar',
 data:{
 labels:Object.keys(areas),
 datasets:[{
 label:'Chamados',
 data:Object.values(areas)
 }]
 }
 });

}

carregarSolicitacoes();

</script>

</body>
</html>
```
